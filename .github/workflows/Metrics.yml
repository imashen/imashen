# Metrics profile card — https://github.com/lowlighter/metrics
# Renders an SVG of your GitHub stats and commits it to the repo root.
name: Metrics

on:
  # Refresh every hour
  schedule: [{cron: "0 * * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Re-run on every push to main
  push: {branches: ["master", "main"]}

# Allow this workflow to commit the rendered SVG back to the repo.
# (Commits made with the built-in GITHUB_TOKEN do not re-trigger this workflow,
#  so there is no infinite loop.)
permissions:
  contents: write

# Avoid overlapping runs (e.g. a manual run firing during a scheduled one)
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GitHub token used to read your data.
          # 1) Create a classic PAT: https://github.com/settings/tokens
          # 2) Scopes: public_repo, read:org, read:project, read:user
          #    - read:project  -> required for the Projects plugin (profile projects)
          #    - read:user     -> recommended (used by optional achievements/org features)
          #    - add `repo`    -> only if you also want to include private repositories
          # 3) Store it as a repository secret named METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}

          # Commit the rendered SVG to the repository root (matches the README reference)
          output_action: commit
          filename: github-metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update github-metrics.svg"

          # Core options
          user: imashen
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Hong_Kong
          config_output: svg

          # Achievements
          # NOTE: `plugin_achievements_secrets: yes` (the default) requires the
          # token to have `read:user` (and often `repo`) scope to compute secret
          # achievements; without it the plugin throws "Unexpected error".
          # Disabling it keeps achievements scopeless and error-free.
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: no
          plugin_achievements_threshold: X

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # People (followers / following)
          plugin_people: yes
          plugin_people_limit: 10
          plugin_people_size: 40
          plugin_people_types: followers, following

          # Projects
          plugin_projects: yes
          plugin_projects_limit: 4
