# Metrics profile card — https://github.com/lowlighter/metrics
# Renders an SVG of your GitHub stats and commits it to the repo root.
name: Metrics

on:
  # Refresh every hour
  schedule: [{cron: "0 * * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Re-run on every push to main
  push: {branches: ["master", "main"]}

# Allow this workflow to commit the rendered SVG back to the repo.
# (Commits made with the built-in GITHUB_TOKEN do not re-trigger this workflow,
#  so there is no infinite loop.)
permissions:
  contents: write

# Avoid overlapping runs (e.g. a manual run firing during a scheduled one)
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Use the maintained community fork instead of lowlighter/metrics@latest.
      # Reason: upstream `@latest` still queries the deprecated Projects (classic)
      # GraphQL field (`user.projects`), which GitHub removed on 2024-05-23.
      # This breaks BOTH the `projects` and `achievements` plugins with
      # "Unexpected error" (the whole query returns `user: null`).
      # `gh-metrics/metrics@master` has migrated achievements to `projectsV2`.
      # See: https://github.blog/changelog/2024-05-23-sunset-notice-projects-classic/
      - uses: gh-metrics/metrics@master
        with:
          # GitHub token used to read your data.
          # 1) Create a classic PAT: https://github.com/settings/tokens
          # 2) Scopes: public_repo, read:org, read:project, read:user
          #    - read:project  -> needed by projectsV2 queries
          #    - read:user     -> used by achievements secrets / org features
          #    - add `repo`    -> only if you also want to include private repositories
          # 3) Store it as a repository secret named METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}

          # Commit the rendered SVG to the repository root (matches the README reference)
          output_action: commit
          filename: github-metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update github-metrics.svg"

          # Core options
          user: imashen
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Hong_Kong
          config_output: svg

          # Achievements
          # The fork migrated this plugin to projectsV2, so it works again.
          # `plugin_achievements_secrets: yes` (default) needs `read:user` scope.
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: X

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # People (followers / following)
          plugin_people: yes
          plugin_people_limit: 10
          plugin_people_size: 40
          plugin_people_types: followers, following

          # Projects — DISABLED
          # GitHub sunset the classic Projects API on 2024-05-23. Even the fork
          # only migrated achievements to projectsV2; the projects plugin itself
          # still relies on the legacy field and has no profile-project data to
          # show for this account anyway. Leave off to keep the card error-free.
          plugin_projects: no
